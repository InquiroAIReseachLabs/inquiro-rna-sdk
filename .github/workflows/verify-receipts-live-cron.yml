# Scheduled: run the README quickstart against the live flight recorder demo.
# Endpoint: rna.config.json (override with the RNA_BASE_URL repo variable).
# Optional secret: RNA_PARTNER_KEY, sent as X-Partner-Key for a pilot tenant.
# Without it the public demo tenant is used, which is what new developers get.
name: Verify RNA Receipts (live API)
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  verify-live:
    runs-on: ubuntu-latest
    env:
      RNA_BASE_URL: ${{ vars.RNA_BASE_URL }}
      RNA_PARTNER_KEY: ${{ secrets.RNA_PARTNER_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Block unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)' -- '*.py' '*.js' '*.yml' '*.md'; then
            echo "ERROR: merge conflict markers found in tracked sources"
            exit 1
          fi
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Wake the service (free tier may be asleep)
        run: |
          url=$(python3 -c 'import rna_config; print(rna_config.health_url())')
          echo "GET $url"
          curl -sS --max-time 120 --retry 2 --retry-delay 10 -o /tmp/health.json -w "HTTP %{http_code}\n" "$url" || true
          cat /tmp/health.json || true

      - name: Submit, verify and tamper-test every live event type
        run: |
          set -euo pipefail
          for p in identity_verified custody_transferred seal_intact seal_broken delivery_confirmed; do
            echo "--- $p ---"
            python3 scripts/first_receipt.py "payloads/$p.json" --out "/tmp/$p.json"
            python3 verifier/verify.py "/tmp/$p.json"
          done
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/identity_verified.json"))
          h = d["receipt_hash"]
          d["receipt_hash"] = h[:-1] + ("0" if h[-1] != "0" else "1")
          json.dump(d, open("/tmp/tampered.json", "w"))
          PY
          if python3 verifier/verify.py /tmp/tampered.json; then
            echo "::error::Tampered receipt verified; tamper detection is broken"
            exit 1
          fi
          echo "Tamper test: one-character change rejected"
